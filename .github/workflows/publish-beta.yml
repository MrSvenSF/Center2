name: Publish Center2 beta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the beta tag
        uses: actions/checkout@v6
        with:
          ref: v1.0.0-beta.1

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Center2/pom.xml

      - name: Build and test Center2
        run: mvn --batch-mode --file Center2/pom.xml clean package

      - name: Upload the beta JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload v1.0.0-beta.1
          Center2/target/Center2-1.0.0-beta.1.jar
          --repo ${{ github.repository }}
