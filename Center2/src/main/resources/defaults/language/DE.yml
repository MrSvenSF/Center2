# Center2 - Language/DE.yml
#
# Die Sprache wird in MainConfig.yml ausgewählt. DE.yml und EN.yml haben immer
# dieselben Schlüssel. Chat-Texte unterstützen MiniMessage, {name}-Platzhalter
# setzt Center2 ein. Meldungen vor dem Laden dieser Datei bleiben englisch.

config-version: 3

plugin:
  enabled: "{product} {version} auf {platform} aktiviert. Registrierte Commands: {commands}."
  enabled-proxy: "{product} {version} auf {platform} aktiviert."
  disabled: "{product} {version} auf {platform} deaktiviert."

reload:
  success: "<green>{product} neu geladen. <gray>Registrierte Commands: <white>{commands}"
  failed: "<red>Reload fehlgeschlagen: <white>{reason}"
  previous-active: "<gray>Die zuletzt funktionierende Konfiguration ist weiterhin aktiv."
  log-success: "{product} neu geladen, {commands} Commands sind registriert."
  log-failed: "Reload von {product} fehlgeschlagen: {reason}"
  network:
    transport-remote: "<gray>Der Netzwerk-Reload läuft über die Remote-Datenbank."
    transport-messaging: "<gray>Der Netzwerk-Reload läuft über den Proxy. Server ohne Spieler werden erreicht, sobald sich dort jemand verbindet."
    remote-down: "<yellow>Die Remote-Datenbank ist nicht erreichbar. Es wird der Weg über den Proxy verwendet."
    no-transport: "<yellow>{product} konnte das Netzwerk nicht erreichen. Dieser Server wurde neu geladen, andere Server nicht."
    header: "<gray>--- <white>{product} Netzwerk-Reload <gray>---"
    entry: "<gray>- <white>{node}<gray>: {status}"
    failed: "<red>Der Netzwerk-Reload ist fehlgeschlagen: <white>{reason}"
    status:
      success: "<green>erfolgreich"
      failed: "<red>fehlgeschlagen"
      pending: "<yellow>noch offen"
      unreachable: "<red>nicht erreichbar"
      expired: "<gray>abgelaufen"
    received: "Ein Netzwerk-Reload von '{origin}' ist eingetroffen und wird lokal ausgeführt."
    log-result: "Netzwerk-Reload von {product}: {result}"

remote:
  disabled: "Das Remote-System von {product} wurde in {file} abgeschaltet."
  invalid: "Das Remote-System ist eingeschaltet, aber nicht verwendbar. {product} läuft weiterhin lokal. {reason}"
  connected: "Die Remote-Datenbank {database} ist verbunden. Dieser Knoten ist '{server}'."
  unreachable: "Die Remote-Datenbank {database} ist nicht erreichbar ({reason}). {product} läuft lokal weiter und versucht es in {seconds}s erneut. Versuch {attempt}."
  duplicate-id: "Ein anderer {product}-Knoten verwendet bereits die server-id '{server}'. Das Remote-System wird auf diesem Knoten abgeschaltet, weil zwei Knoten mit einer ID im Netzwerk nicht unterscheidbar sind. Vergib in {file} für jeden Knoten eine eigene 'remote.server-id'. Lokal läuft {product} weiter."
  purged: "Die Remote-Datenbank hat {rows} abgelaufene Einträge entfernt."
  task-failed: "Die Remote-Aufgabe '{task}' von {product} ist fehlgeschlagen."
  action-rejected: "Die Netzwerkaktion '{action}' von '{namespace}' wurde nicht ausgeführt: {reason}"
  action-failed: "Die Netzwerkaktion '{action}' von '{namespace}' ist auf diesem Knoten fehlgeschlagen."

command:
  no-permission: "<red>Du hast keine Berechtigung für diesen Command."
  unknown: "<red>Unbekannter Command. <gray>Nutze <white>/{path}<gray> für eine Übersicht."
  overview-header: "<gray>--- <white>{product} {version} <gray>---"
  overview-entry: "<white>/{path}<gray> - {description}"
  overview-empty: "<gray>Für dich ist kein Command verfügbar."
  description:
    center-info: "öffnet das {product}-Infomenü"
    reload: "lädt die {product}-Konfiguration neu"
    modules: "zeigt alle installierten Module"
    modules-reload: "prüft den Modulordner erneut"
    modules-enable: "aktiviert ein Modul"
    modules-disable: "deaktiviert ein Modul"

menu:
  disabled: "<red>Dieses {product}-Menü ist deaktiviert."
  back:
    name: "<white>Zurück"
    lore: "Geht eine Ebene zurück."
  center-info:
    creator:
      name: "<white>Ersteller"
      player: "<white>{creator}"
      description: "Ersteller und Entwickler von {product}."
    organization:
      name: "<white>{organization}"
      description-1: "{product} ist ein Projekt von {organization}."
      description-2: "Mehr Informationen: {website}"
      open: "<white>Webseite öffnen: <aqua>{website}"
    admin:
      lore: "Öffnet das Admin-Menü."
    close:
      name: "<red>Schließen"
      lore: "Schließt dieses Menü."
  center-admin:
    status:
      name: "<white>Status"
    server-status:
      name: "<white>Serverstatus"
      lore: "Zeigt die {product}-Instanzen im Netzwerk."
  modules:
    entry:
      name: "<white>{module}"
      version: "Version: <white>{version}"
      status: "Status: <white>{status}"
      open: "Klicke für Details."
    empty:
      name: "<white>Kein Modul installiert"
      lore: "Lege eine Modul-JAR in Modules/Jars ab."
    too-many: "Es sind {installed} Module installiert, im Admin-Menü werden {shown} davon angezeigt. Die übrigen bleiben installiert und über den Modulcommand erreichbar."
  module:
    title: "Modul: {module}"
    info:
      name: "<white>{module}"
      id: "ID: <white>{id}"
      version: "Version: <white>{version}"
      author: "Autor: <white>{author}"
      status: "Status: <white>{status}"
      platform: "Plattform: <white>{platform}"
      center: "{product}: <white>{range}"
      minecraft: "Minecraft: <white>{range}"
    enable:
      name: "<green>Aktivieren"
      lore: "Startet dieses Modul."
    disable:
      name: "<red>Deaktivieren"
      lore: "Stoppt dieses Modul."
  server-status:
    velocity:
      name: "<white>Proxy"
    server:
      name: "<white>{server}"
    state:
      line: "Status: <white>{state}"
      connected: "verbunden"
      unreachable: "nicht erreichbar"
      unknown: "noch nicht verifiziert"

status:
  header: "<gray>--- <white>{product} <gray>Status ---"
  line: "<gray>{label}: <white>{value}"
  lore-line: "{label}: <white>{value}"
  label:
    version: "Version"
    platform: "Plattform"
    minecraft: "Minecraft"
    uptime: "Laufzeit"

module:
  loaded: "{installed} Module installiert, {enabled} davon aktiv."
  skipped: "Modul '{module}' wurde übersprungen: {reason}"
  command-conflict: "Der Command-Pfad '{path}' von Modul '{module}' ist bereits vergeben und wurde übersprungen."
  error: "Modul '{module}' (ID {id}, Version {version}) ist im Schritt {step} fehlgeschlagen: {reason}"
  incompatible-center: "Modul '{module}' (ID {id}, Version {version}) unterstützt Center2 {required}, hier läuft {running}. Das Modul bleibt deaktiviert."
  incompatible-minecraft: "Modul '{module}' (ID {id}, Version {version}) unterstützt Minecraft {required}, hier läuft {running}. Das Modul bleibt deaktiviert."
  admin-disabled: "Modul '{module}' (ID {id}) bleibt deaktiviert, weil es administrativ abgeschaltet wurde."
  reloaded: "{modules} aktive Module haben die neue Konfiguration übernommen."
  jar-changed: "Die JAR '{file}' von Modul '{module}' (ID {id}) wurde geändert oder entfernt. Das Modul hat in dieser Laufzeit bereits Klassen geladen, deshalb ist für den Austausch ein Serverneustart nötig."
  environment: "{product} prüft Module gegen Minecraft {version}."
  environment-unknown: "{product} konnte die Minecraft-Version des Servers nicht bestimmen (gelesen: '{version}'). Es wird kein Modul geladen, weil die Kompatibilität nicht bestätigt werden kann."
  scan-failed: "Der Modulordner '{directory}' konnte nicht gelesen werden: {reason}. Er gilt deshalb nicht als leer."
  state-unreadable: "Der gespeicherte Modulzustand konnte nicht gelesen werden: {reason}. Es wird kein Modul automatisch gestartet."
  state-disable-not-stored: "Modul '{module}' (ID {id}) ist für diese Laufzeit deaktiviert, der Zustand konnte aber nicht gespeichert werden: {reason}. Nach einem Neustart kann es wieder aktiv sein."
  state-enable-not-stored: "Modul '{module}' (ID {id}) ist für diese Laufzeit aktiviert, der Zustand konnte aber nicht gespeichert werden: {reason}. Nach einem Neustart kann es wieder deaktiviert sein."
  platform:
    paper: "Paper"
    velocity: "Velocity"
    both: "Paper & Velocity"
  status:
    enabled: "Aktiviert"
    disabled: "Deaktiviert"
    incompatible: "Nicht kompatibel"
    error: "Modul Error"
  reason:
    center-version: "{product}-Version wird nicht unterstützt."
    minecraft-version: "Minecraft-Version wird nicht unterstützt."

modules:
  list-header: "<gray>--- <white>{product} Module <gray>---"
  list-entry: "<white>{module}<gray> ({id}) <gray>Version <white>{version}<gray> - <white>{status}"
  list-empty: "<gray>Es ist kein Modul installiert."
  usage: "<red>Es fehlt die Modul-ID. <gray>Nutze <white>/{path} [Modul-ID]"
  unknown: "<red>Es gibt kein installiertes Modul mit der ID <white>{module}<red>."
  enabled: "<green>Modul <white>{module}<green> wurde aktiviert."
  disabled: "<green>Modul <white>{module}<green> wurde deaktiviert."
  already-enabled: "<gray>Modul <white>{module}<gray> ist bereits aktiviert."
  already-disabled: "<gray>Modul <white>{module}<gray> ist bereits deaktiviert."
  incompatible: "<red>Modul <white>{module}<red> ist nicht kompatibel: <gray>{reason}"
  error: "<red>Modul <white>{module}<red>: Modul Error. <gray>Einzelheiten stehen in der Serverkonsole."
  unavailable: "<red>Das {product}-Modulsystem ist nicht verfügbar. <gray>Die Ursache steht in der Serverkonsole."
  reloaded: "<green>Modulordner neu gelesen. <gray>Installiert: <white>{installed}<gray>, aktiv: <white>{enabled}"

registry:
  name-taken: "Der Command '{command}' wird bereits von einem anderen Plugin verwendet. Er ist nur als '{namespace}:{command}' erreichbar."
  remove-failed: "Der Commandname '{command}' konnte nicht vom Server entfernt werden."
  remove-leftovers: "Die folgenden alten Commandnamen konnten nicht entfernt werden: {commands}. Ein Serverneustart entfernt sie."

commands-file:
  disabled: "Das Menü '{menu}' ist in MainConfig.yml deaktiviert, deshalb wurde der Command '{command}' in {file} auf 'enabled: false' gesetzt."
  disable-failed: "Der Command '{command}' konnte in {file} nicht auf 'enabled: false' gesetzt werden: {reason}"
