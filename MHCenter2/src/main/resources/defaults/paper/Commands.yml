# MHCenter2 - Commands.yml
#
# Per command you can change:
#   enabled   whether the command exists
#   command   the full command path, written without a leading slash
#   aliases   optional list of further full command paths
#
# What a command does is fixed and cannot be configured here.
# "/center reload" and the module overview "/center modules" are built in and are
# therefore not listed; a configured path may not take them away either.

config-version: 3

commands:
  # Opens the Center-Info menu.
  center-info:
    enabled: true
    command: "center info"
    aliases:

  # Reads Modules/Jars again.
  modules-reload:
    enabled: true
    command: "center modules reload"
    aliases:

  # Starts one module: <path> <module-id>
  modules-enable:
    enabled: true
    command: "center modules enable"
    aliases:

  # Stops one module: <path> <module-id>
  modules-disable:
    enabled: true
    command: "center modules disable"
    aliases:
